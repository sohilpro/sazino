name: sazino

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-api-env: &api-env
  NODE_ENV: production
  API_PORT: '4000'
  DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
  REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: ${MINIO_BUCKET:-myapp-media}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?required}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
  S3_REGION: us-east-1
  MEDIA_PUBLIC_URL: https://media.${PLATFORM_DOMAIN:?required}/${MINIO_BUCKET:-myapp-media}
  PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?required}
  CORS_ORIGINS: https://app.${PLATFORM_DOMAIN}
  DASHBOARD_URL: https://app.${PLATFORM_DOMAIN}
  STOREFRONT_URL_TEMPLATE: https://{subdomain}.${PLATFORM_DOMAIN}
  DOMAIN_CNAME_TARGET: stores.${PLATFORM_DOMAIN}
  DOMAIN_SERVER_IPS: ${DOMAIN_SERVER_IPS:-}
  DOMAIN_REVALIDATE: 'true'
  DNS_RESOLVERS: ${DNS_RESOLVERS:-1.1.1.1,8.8.8.8}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?required}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?required}
  SMS_DRIVER: melipayamak
  MELI_SMS_USER: ${MELI_SMS_USER:?required}
  MELI_SMS_PASS: ${MELI_SMS_PASS:?required}
  MELI_SMS_PATTERN_OTP: ${MELI_SMS_PATTERN_OTP:?required}
  MELI_SMS_PATTERN_ORDER: ${MELI_SMS_PATTERN_ORDER:-}
  MELI_SMS_PATTERN_SHIPPED: ${MELI_SMS_PATTERN_SHIPPED:-}
  PAYMENT_DRIVER: zarinpal
  ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
  MAIL_DRIVER: ${MAIL_DRIVER:-none}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}
  QUEUE_PREFIX: myapp
  TRUST_PROXY_HOPS: '1'
  CACHE_ENABLED: 'true'
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
  RATE_LIMIT_ENABLED: 'true'
  RATE_LIMIT_IP_PER_MIN: ${RATE_LIMIT_IP_PER_MIN:-300}
  RATE_LIMIT_TENANT_PER_MIN: ${RATE_LIMIT_TENANT_PER_MIN:-6000}
  REQUIRE_PROXY_TOKEN: 'true'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # BullMQ: noeviction الزامی است
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: chainguard/minio:latest
    restart: unless-stopped
    logging: *logging
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - minio_data:/data

  migrate:
    image: ${IMAGE_PREFIX:-sazino}-migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    restart: 'no'
    logging: *logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE_PREFIX:-sazino}-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    environment:
      <<: *api-env
      JOBS_ENABLED: 'false'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  # همان ایمیج API؛ فقط worker و scheduler (اعلان‌ها و نگهداری) را اجرا می‌کند
  worker:
    image: ${IMAGE_PREFIX:-sazino}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    environment:
      <<: *api-env
      JOBS_ENABLED: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  storefront:
    image: ${IMAGE_PREFIX:-sazino}-storefront:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/nuxt.Dockerfile
      args:
        APP: storefront
        PORT: '3000'
    restart: unless-stopped
    logging: *logging
    environment:
      NUXT_API_ORIGIN: http://api:4000
      NUXT_TRUST_PROXY: 'true'
      NUXT_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?required}
      NUXT_CANONICAL_REDIRECT: ${CANONICAL_REDIRECT:-false}
      NUXT_MEDIA_ORIGIN: https://media.${PLATFORM_DOMAIN}
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    image: ${IMAGE_PREFIX:-sazino}-dashboard:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/nuxt.Dockerfile
      args:
        APP: dashboard
        PORT: '3001'
    restart: unless-stopped
    logging: *logging
    environment:
      NUXT_PUBLIC_API_BASE: https://api.${PLATFORM_DOMAIN}/api
      NUXT_PUBLIC_PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
      NUXT_MEDIA_ORIGIN: https://media.${PLATFORM_DOMAIN}

  caddy:
    image: ${IMAGE_PREFIX:-sazino}-caddy:${IMAGE_TAG:-latest}
    build:
      context: infra/caddy
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?required}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-127.0.0.1}
      MINIO_BUCKET: ${MINIO_BUCKET:-myapp-media}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - storefront
      - dashboard
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config: